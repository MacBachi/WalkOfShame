name: Bug
description: Something in the app misbehaves
labels: [bug]
body:
  - type: textarea
    id: was
    attributes:
      label: What happens
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: schritte
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a session
        2. Press pause
        3. Step back onto the belt
    validations:
      required: true

  - type: input
    id: geraet
    attributes:
      label: iPhone, iOS version, app language
      placeholder: iPhone 8, iOS 16.7.16, German
    validations:
      required: false

  - type: checkboxes
    id: sicherheit
    attributes:
      label: Safety
      options:
        - label: This bug involves the treadmill control (`0x2AD9`) — the belt moved when it should not have, or a command went out without confirmation.
          required: false
